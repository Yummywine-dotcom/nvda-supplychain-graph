[project]
name = "nvda-supplychain-graph"
version = "1.3.0"
description = "Offline NVIDIA supply-chain and partnership research API/CLI"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
  "pydantic>=2.6.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
